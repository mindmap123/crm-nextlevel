name: Neon database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          test -n "$DIRECT_URL"
          mkdir -p backups
          docker run --rm \
            -e DIRECT_URL="$DIRECT_URL" \
            -v "$PWD/backups:/backups" \
            postgres:17-alpine \
            sh -c 'pg_dump "$DIRECT_URL" --format=custom --no-owner --no-acl --file "/backups/crm-nextlevel-$(date -u +%Y%m%dT%H%M%SZ).dump"'

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
